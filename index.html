<link rel="manifest" id="manifestLink">
<style>
:root{
  --bg:#12152b; --bg2:#1a1f3d; --card:#20264a; --card2:#2a3160; --line:#353d73;
  --text:#eef0ff; --dim:#9aa1d0; --mint:#3ce0a0; --gold:#ffc247; --sky:#4fb3ff;
  --coral:#ff6b6b; --violet:#a78bfa; --pink:#ff7ac6;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:15px;line-height:1.35;overscroll-behavior:none;-webkit-text-size-adjust:100%;}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font-size:16px;font-family:inherit}
textarea,input[type=text]{user-select:text;-webkit-user-select:text}
/* header */
#top{padding:calc(var(--sat) + 8px) 12px 8px;background:linear-gradient(180deg,#1b2050,#161a3a);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:5}
.toprow{display:flex;align-items:center;gap:8px}
.brand{font-weight:800;font-size:15px;letter-spacing:.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:600;color:var(--dim);font-size:11px;letter-spacing:0}
.iconbtn{width:44px;height:44px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:20px}
.stats{display:grid;grid-template-columns:1.25fr 1fr .8fr;gap:6px;margin-top:8px}
.stat{background:rgba(0,0,0,.25);border-radius:10px;padding:5px 8px;position:relative}
.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.stat.cash b{color:var(--mint)} .stat.cash.neg b{color:var(--coral)} .stat.rp b{color:var(--violet)}
.timebar{display:flex;align-items:center;gap:6px;margin-top:8px}
.date{flex:1;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.date small{color:var(--dim);font-weight:600}
.spd{min-width:44px;height:36px;border-radius:10px;background:var(--card);font-weight:800;font-size:13px;padding:0 8px}
.spd.on{background:var(--mint);color:#06281b}
.spd.pause.on{background:var(--gold);color:#3a2700}
/* main */
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px;overscroll-behavior:contain}
.tab{display:none} .tab.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* nav */
#nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#161a3a;border-top:1px solid var(--line);padding-bottom:var(--sab)}
#nav button{background:none;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim);font-weight:700;min-height:56px;position:relative}
#nav button i{font-style:normal;font-size:22px;filter:grayscale(.6);transition:transform .15s}
#nav button.on{color:var(--text)} #nav button.on i{filter:none;transform:translateY(-2px) scale(1.1)}
#nav button.on::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--mint)}
.dot{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--coral);display:none}
.dot.on{display:block}
/* cards & ui */
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px;border:1px solid rgba(255,255,255,.04)}
.card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:6px}
.card h3 .r{margin-left:auto;font-size:12px;color:var(--dim);font-weight:600}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);font-weight:800;margin:16px 4px 8px}
.muted{color:var(--dim);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;background:var(--card2);font-weight:800;font-size:15px;transition:transform .08s,filter .15s}
.btn:active,.iconbtn:active,.spd:active,.chip:active,.opt:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(180deg,#4cf0b0,#25c487);color:#04281a;box-shadow:0 4px 0 #128a5b}
.btn.gold{background:linear-gradient(180deg,#ffd36e,#f2a922);color:#3a2700;box-shadow:0 4px 0 #b57a0c}

 const v={id:d.id,name:d.name,biz:d.biz,niche:d.niche,chan:d.chan,scope:d.scope,rating,peak,t:0,health:1,boost:1,boostW:0,pushCd:0,totalRev:0,lastRev:0,lastUp:0,launched:S.week};

 S.history.unshift({id:v.id,name:v.name,biz:v.biz,niche:v.niche,chan:v.chan,scope:v.scope,rating,launched:S.week,totalRev:0,status:'running',cost:d.cost});
 // knowledge
 const kf=S.know['f:'+d.biz]||0;let insight='';
 if(kf<3){S.know['f:'+d.biz]=kf+1;insight='New insight: you now know what matters in the <b>'+PHASES[kf].n+'</b> phase for '+b.name+' (★ hints on sliders).';}
 S.know['bn:'+d.biz+':'+d.niche]=1;S.know['bc:'+d.biz+':'+d.chan]=1;S.know['nc:'+d.niche+':'+d.chan]=1;
 S.stats.launches++;S.stats.best=Math.max(S.stats.best,rating);S.stats.scopeMax=Math.max(S.stats.scopeMax,d.scope);
 if(d.scope===3&&rating>=9)S.stats.moon9=true;
 S.lastBiz=d.biz+':'+d.niche;
 const rpGain=Math.round(rating*(1+d.scope)*.8);S.rp+=rpGain;
 const xp=Math.round(rating*10*[1,2.5,5,10][d.scope]);
 S.dev=null;
 S.lastP=P;showLaunch(v,{P,align,aligns,ratio,ideaShare,bn,bc,nc,rpGain,xp,insight,novelty,total,target});
 gainXp(xp);dirty();
}

  (S.running.length?'<div class="score" style="color:var(--mint)">+'+fmt(earned)+'</div><p class="muted" style="text-align:center">'+S.running.length+' running venture'+(S.running.length>1?'s':'')+' kept earning (after rent & wages).</p>'+(earned===0?'<p class="muted">Costs ate your profits while you were away, but your team took leave so you didn\'t lose anything.</p>':'')

 const st=[

   return '<button class="chip'+(w.chan===k?' sel':'')+(ok?'':' lock')+'" data-act="'+(ok?'wchan':'wlock')+'" data-v="'+k+'"><span class="e">'+(ok?c.e:'🔒')+'</span><span class="nm">'+c.name+'</span><span class="sb">Trend '+p.toFixed(2)+(p>pv+.01?' ▲':p<pv-.01?' ▼':'')+(c.paid?' · Ads x'+T.ad[k].toFixed(2):'')+'</span>'+(ok?fitPill(f>=.9?1:f<=.45?.3:.65,known):'')+'</button>';}).join('')+'</div>';}
 if(s===3){const b=BIZ[w.biz];body='<div class="chips" style="grid-template-columns:1fr">'+SCOPES.map((sc,i)=>{const lock=sc.req&&!has(sc.req)?'Research '+resInfo(RESMAP[sc.req]).name:S.loc<sc.loc?'Needs '+LOCS[sc.loc].name:'';
   return '<button class="opt'+(w.scope===i?' sel':'')+(lock?' lock':'')+'" data-act="'+(lock?'wlock':'wscope')+'" data-v="'+i+'"><div class="row"><span style="font-size:24px">'+sc.e+'</span><div class="grow"><b>'+sc.name+'</b><div class="muted" style="font-size:12px">'+(lock?'🔒 '+lock:sc.weeks+' weeks · cost '+fmt(b.cost*sc.cost)+' · revenue x'+sc.rev)+'</div></div></div></button>';}).join('')+'</div>'+
   '<div class="sec">Venture name</div><div class="row"><input type="text" id="wizName" maxlength="28" value="'+esc(w.name)+'" autocomplete="off"><button class="iconbtn" data-act="wdice" aria-label="Random name">🎲</button></div>'+
   '<div class="card" style="margin-top:12px;background:var(--card2)"><b>'+b.e+' '+b.name+'</b> · '+NICHE[w.niche].e+' '+NICHE[w.niche].name+' · '+CHAN[w.chan].e+' '+CHAN[w.chan].name+
   '<div class="kv"><div><span>Cost</span><b>'+fmt(b.cost*SCOPES[w.scope].cost)+'</b></div><div><span>Build</span><b>'+Math.ceil(SCOPES[w.scope].weeks*(has('pmboard')?.9:1))+' wks</b></div><div><span>Cash</span><b class="'+(S.cash>=b.cost*SCOPES[w.scope].cost?'pos':'neg')+'">'+fmt(S.cash)+'</b></div></div>'+
   (S.lastBiz===w.biz+':'+w.niche?'<div class="hint" style="color:var(--gold)">⚠️ Same business + niche as your last launch. Customers like novelty.</div>':'')+'</div>';}
 const canNext=[w.biz,w.niche,w.chan][s];const cost=w.biz?BIZ[w.biz].cost*SCOPES[w.scope].cost:0;
 const foot=(s>0?'<button class="btn" data-act="wback">← Back</button>':'<button class="btn" data-act="mclose">Cancel</button>')+
  (s<3?'<button class="btn primary'+(canNext?'':' dis')+'" data-act="wnext">Next →</button>':'<button class="btn primary'+(S.cash>=cost?'':' dis')+'" data-act="wstart">🚀 Start!</button>');
 return sheet(title+' <span class="muted" style="font-size:13px">'+(s+1)+'/4</span>',body,foot);}
function wizRefresh(){rerenderModal(wizHTML());}

/* ================= LAUNCH RESULT ================= */
const QUOTES=[["Website looks like it's from 2009.","Requested a refund.","Not sure who this is for.","Pass."],["Solid, nothing special.","Has potential.","Decent value for money.","Watching with interest."],
 ["Obsessed! Telling all my mates.","One to watch this year.","Genuinely useful.","Strong traction."],["Best thing I've bought all year!","A category-defining launch.","Take my money!!","We want in."]];
function showLaunch(v,i){const b=BIZ[v.biz],R=[['🛒','Customers'],['🗞️','Startup Daily'],['💬','Reddit'],['🏦','Investors']];
 const revs=R.map((r,k)=>{const sc=clamp(Math.round(v.rating+rnd(-1.2,1.2)),1,10),bk=sc<4?0:sc<7?1:sc<9?2:3;return '<div class="rev" style="animation-delay:'+(.3+k*.15)+'s"><div class="who">'+r[0]+' '+r[1]+'</div><b>'+sc+'</b><span class="muted">/10</span><q>'+QUOTES[bk][k]+'</q></div>';}).join('');
 const fitRow=(n,f)=>{const l=fitLabel(f);return '<div><span>'+n+'</span><b class="'+l[1]+'">'+l[0]+'</b></div>';};
 const bal=Math.abs(i.ideaShare-b.idea)<.1?'<b class="pos">Spot on</b>':i.ideaShare<b.idea?'<b class="neg">Needed more 💡 ideas</b>':'<b class="neg">Needed more 🔧 skill</b>';
 const pct=x=>Math.round(x*100)+'%';
 const body='<div class="bigemoji">'+b.e+'</div><h2 style="text-align:center;margin:0">'+esc(v.name)+' launched!</h2><div class="score" id="scoreNum">0.0</div><div style="text-align:center" class="muted">Launch rating</div>'+
  '<div class="reviews">'+revs+'</div><div class="sec">Launch report</div><div class="report card">'+fitRow('Business × Niche',i.bn)+fitRow('Business × Channel',i.bc)+fitRow('Niche × Channel',i.nc)+
  '<div><span>Focus choices</span><b class="'+(i.align>.75?'pos':i.align<.5?'neg':'')+'">'+pct(i.align)+'</b></div><div><span>Ideas vs skill</span>'+bal+'</div><div><span>Work done vs expectations</span><b class="'+(i.P>=1?'pos':i.P<.75?'neg':'')+'">'+pct(i.P)+'</b></div>'+
  '<div><span>'+CHAN[v.chan].name+' trend</span><b>x'+S.trend.pop[v.chan].toFixed(2)+'</b></div>'+(i.novelty?'<div><span>Repeat combo penalty</span><b class="neg">−0.6</b></div>':'')+'</div>'+
  (i.insight?'<div class="await">💡 '+i.insight+'</div>':'')+
  '<div class="row" style="justify-content:center;gap:6px;flex-wrap:wrap"><span class="pill violet">+'+i.rpGain+' RP</span><span class="pill gold">+'+i.xp+' XP</span><span class="pill mint">Peak ~'+fmt(ventureRev(Object.assign({},v,{t:4})))+'/wk</span></div>';
 openModal('<div class="mbody" style="padding-top:16px">'+body+'</div><div class="mfoot"><button class="btn primary" data-act="mclose">Awesome</button></div>');
 sfx('launch');if(v.rating>=8)confetti(v.rating>=9?40:24);
 const el=$('#scoreNum');if(el){const t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/900);el.textContent=(v.rating*(1-Math.pow(1-k,3))).toFixed(1);if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}}

/* ================= OTHER MODALS ================= */
function hireHTML(){if(!S.cands.length||S.week-S.candWeek>=8)genCands();const free=S.week-S.candWeek>=4;
 const body='<p class="muted" style="margin-top:0">Hiring fee = 2 weeks salary. Desks: '+S.staff.length+' / '+LOCS[S.loc].staff+'</p>'+
  (S.cands.length?S.cands.map((c,i)=>{const R=ROLES[c.role];return '<div class="card" style="background:var(--card2)"><div class="row"><span style="font-size:32px">'+R.e+'</span><div class="grow"><b>'+esc(c.name)+'</b> <span class="muted">· '+R.name+'</span><div class="hint" style="margin:0">'+R.perk+'</div></div></div>'+
   '<div class="kv"><div><span>💡 Creative</span><b>'+c.cre+'</b></div><div><span>🔧 Technical</span><b>'+c.tec+'</b></div><div><span>⚡ Speed</span><b>'+c.spd+'</b></div></div>'+
   '<div class="row" style="margin-top:8px"><span class="grow">'+fmt(c.sal)+'/wk</span><button class="btn primary sm'+(S.cash<c.sal*2?' dis':'')+'" data-act="hire" data-i="'+i+'">Hire · '+fmt(c.sal*2)+'</button></div></div>';}).join(''):'<div class="empty">No candidates left. Refresh the job ad!</div>');
 return sheet('Hire staff',body,'<button class="btn" data-act="mclose">Close</button><button class="btn gold'+(!free&&S.cash<100?' dis':'')+'" data-act="refcands">🔄 New ad '+(free?'(free)':'$100')+'</button>','👥');}
function settingsHTML(){const b='<div class="sec" style="margin-top:0">Company</div><div class="row"><input type="text" id="coName" maxlength="24" placeholder="Company name" value="'+esc(S.company)+'"><button class="btn sm" data-act="savename">Save</button></div>'+
 '<div class="sec">Preferences</div><div class="grid2"><button class="btn" data-act="toggle" data-v="sound">'+(S.settings.sound?'🔊 Sound on':'🔇 Sound off')+'</button><button class="btn" data-act="toggle" data-v="vibe">'+(S.settings.vibe?'📳 Vibrate on':'📴 Vibrate off')+'</button></div>'+
 '<div class="sec">Backup</div><button class="btn block" data-act="export">📤 Export save code</button><textarea id="saveCode" placeholder="Your save code appears here. Paste a code here to import." style="margin-top:8px"></textarea>'+
 '<div class="grid2" style="margin-top:8px"><button class="btn" data-act="copy">📋 Copy</button><button class="btn gold" data-act="import">📥 Import</button></div>'+
 '<div class="sec">How to play</div><div class="card muted" style="font-size:13px;line-height:1.5">1. Start a venture: business + niche + channel. Good combos score higher.<br>2. Set focus sliders for each phase. ★ hints appear as you gain experience.<br>3. Launch and get rated. Ventures keep earning weekly until you sell or close them.<br>4. Spend 📚 RP in Learn to unlock businesses, niches, channels and tools.<br>5. Move from Home → Co-working → Office → HQ and hire staff.<br>6. Trends shift every year. Ventures earn while you\'re away (up to '+OFFLINE_CAP_H+'h).<br><br>Tip: Add to Home Screen for full-screen play. Progress autosaves on this device.</div>'+
 '<div class="sec">Danger zone</div><button class="btn danger block" data-act="reset">🗑️ Reset game</button><div class="hint" style="text-align:center">Hustle Tycoon · save v'+SAVE_VERSION+'</div>';
 return sheet('Settings',b,'','⚙️');}
function introHTML(){return '<div class="mbody" style="padding-top:18px"><div class="bigemoji">💻</div><h2 style="text-align:center;margin:4px 0">Hustle Tycoon</h2><p style="text-align:center" class="muted">You\'ve got a laptop, a bedroom desk and <b style="color:var(--mint)">$2,000</b> in savings. Time to build an empire.</p>'+
 '<div class="card" style="font-size:14px;line-height:1.5">🚀 Launch online businesses: pick a <b>type</b>, <b>niche</b> and <b>channel</b><br>🎚️ Set focus sliders as your team builds it<br>⭐ Get rated and earn weekly income<br>📚 Research new businesses and tools<br>🏙️ Grow from bedroom to HQ</div>'+
 '<div class="sec">Name your company</div><input type="text" id="introName" maxlength="24" placeholder="e.g. Hayden Ventures" autocomplete="off"></div><div class="mfoot"><button class="btn primary big" data-act="introgo">Let\'s hustle →</button></div>';}

/* ================= INPUT ================= */
document.addEventListener('pointerdown',e=>{unlockAudio();if(e.target.matches&&e.target.matches('input[type=range]'))dragging=true;},{passive:true});
['pointerup','pointercancel','touchend'].forEach(ev=>document.addEventListener(ev,()=>{dragging=false;},{passive:true}));
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset&&t.dataset.sl!==undefined&&S.dev){const d=S.dev,a=+t.dataset.sl;d.sl[d.phase][a]=+t.value;t.style.setProperty('--v',t.value+'%');const sl=d.sl[d.phase],tot=sl[0]+sl[1]+sl[2]||1;for(let k=0;k<3;k++)set('sh-'+k,Math.round(sl[k]/tot*100)+'%');}
 if(t.id==='wizName'&&wiz)wiz.name=t.value;});
$('#modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap'&&!$('#modal [data-act=choice]')&&!$('#introName'))closeModal();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id?+b.dataset.id:null;
 switch(a){
 case 'tab':curTab=v;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id==='tab-'+v));$('#main').scrollTop=0;render();break;
 case 'speed':S.speed=+v;dirty();break;
 case 'settings':openModal(settingsHTML(),true);break;
 case 'mclose':closeModal();break;
 case 'newv':openWizard();break;
 case 'wlock':toast('🔒 Locked. Check the Learn tab or your location.');break;
 case 'wbiz':wiz.biz=v;wizRefresh();break;
 case 'wniche':wiz.niche=v;wizRefresh();break;
 case 'wchan':wiz.chan=v;wizRefresh();break;
 case 'wscope':wiz.scope=+v;wizRefresh();break;
 case 'wnext':if([wiz.biz,wiz.niche,wiz.chan][wiz.step]){wiz.step++;if(wiz.step===3&&!wiz.name)wiz.name=genName(wiz.biz,wiz.niche);rerenderModal(wizHTML());$('#modal .mbody').scrollTop=0;}break;
 case 'wback':wiz.step--;rerenderModal(wizHTML());break;
 case 'wdice':wiz.name=genName(wiz.biz,wiz.niche);$('#wizName').value=wiz.name;break;
 case 'wstart':{const w=wiz;w.name=(($('#wizName')||{}).value||w.name||'').trim();if(startVenture(w)){closeModal();if(curTab!=='office')document.querySelector('#nav [data-v=office]').click();}break;}
 case 'phasego':if(S.dev){S.dev.await=false;if(S.speed===0)S.speed=1;sfx('phase');dirty();}break;
 case 'push':pushVenture(id);break;
 case 'sell':{const x=S.running.find(q=>q.id===id);if(!x)break;const o=sellOffer(x);
  openModal(sheet('Sell '+esc(x.name)+'?','<p>A buyer is offering:</p><div class="score" style="color:var(--mint)">'+fmt(o)+'</div><p class="muted">Based on current weekly profit ('+fmt(ventureProfit(x))+'), rating '+x.rating.toFixed(1)+' and how sellable a '+BIZ[x.biz].name+' is. Offers refresh every 4 weeks.</p>',
   '<button class="btn" data-act="mclose">Keep it</button><button class="btn gold" data-act="sellok" data-id="'+id+'">💰 Sell</button>','💰'),true);break;}
 case 'sellok':closeModal();sellVenture(id);break;
 case 'close':openModal(sheet('Close venture?','<p>Shut it down for good? You get nothing back, but you stop paying its upkeep and free a slot.</p>','<button class="btn" data-act="mclose">Cancel</button><button class="btn danger" data-act="closeok" data-id="'+id+'">Close it</button>','🗑️'),true);break;
 case 'closeok':closeModal();closeVenture(id);break;
 case 'hireopen':openModal(hireHTML(),true);break;
 case 'hire':hire(+b.dataset.i);break;
 case 'refcands':{const free=S.week-S.candWeek>=4;if(!free){if(S.cash<100)break;S.cash-=100;}genCands();rerenderModal(hireHTML());break;}
 case 'fire':{const s=S.staff.find(q=>q.id===id);openModal(sheet('Let '+esc(s.name)+' go?','<p>They will leave immediately.</p>','<button class="btn" data-act="mclose">Cancel</button><button class="btn danger" data-act="fireok" data-id="'+id+'">Let go</button>','👋'),true);break;}
 case 'fireok':closeModal();fire(id);break;
 case 'train':train(b.dataset.who,b.dataset.stat);break;
 case 'move':moveLoc();break;
 case 'research':doResearch(b.dataset.id);break;
 case 'course':buyCourse();break;
 case 'choice':{const ch=curChoices[b.dataset.id];const c=ch&&ch[+b.dataset.i];delete curChoices[b.dataset.id];closeModal();if(c&&c.f)c.f();dirty();break;}
 case 'savename':S.company=$('#coName').value.trim().slice(0,24);save();toast('✅ Saved');dirty();break;
 case 'toggle':S.settings[v]=!S.settings[v];rerenderModal(settingsHTML());break;
 case 'export':{const c=exportCode();$('#saveCode').value=c;toast('📤 Save code ready. Copy it somewhere safe!');break;}
 case 'copy':{const ta=$('#saveCode');if(!ta.value)ta.value=exportCode();ta.select();
  (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast('📋 Copied!')).catch(()=>{try{document.execCommand('copy');toast('📋 Copied!');}catch(_){toast('Select the text and copy manually');}});break;}
 case 'import':try{const st=importCode($('#saveCode').value);S=st;S.savedAt=Date.now();save();closeModal();toast('📥 Save imported!');dirty();}catch(err){toast('❌ '+err.message);$('#saveCode').classList.add('shake');}break;
 case 'reset':openModal(sheet('Reset everything?','<p>This permanently deletes your progress on this device. Export a save code first if you might want it back.</p>','<button class="btn" data-act="mclose">Cancel</button><button class="btn danger" data-act="resetok">Yes, reset</button>','⚠️'),true);break;
 case 'resetok':localStorage.removeItem(SAVE_KEY);S=freshState();S.savedAt=Date.now();save();closeModal();mQueue=[];openModal(introHTML(),true);dirty();break;
 case 'introgo':S.company=(($('#introName')||{}).value||'').trim().slice(0,24)||'Hustle Co.';S.seenIntro=true;save();closeModal();dirty();break;
 }});

/* ================= LOOP & LIFECYCLE ================= */
let lastT=performance.now(),lastSave=Date.now();
function frame(t){const dt=Math.min(250,t-lastT);lastT=t;
 if(!S){requestAnimationFrame(frame);return;}
 try{if(S.speed>0&&!mOpen&&!document.hidden)advance(dt/WEEK_MS[S.speed]);
  if(needRender&&!dragging)render();refreshLive();
  if(Date.now()-lastSave>4000){save();lastSave=Date.now();}}catch(err){console.error(err);}
 requestAnimationFrame(frame);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offlineProgress();save();dirty();lastT=performance.now();}});
window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);
function setupManifest(){try{const icon=document.querySelector('link[rel=apple-touch-icon]').href;
 const m={name:'Hustle Tycoon',short_name:'Hustle',start_url:location.href.split('#')[0],display:'standalone',orientation:'portrait',background_color:'#12152b',theme_color:'#12152b',icons:[{src:icon,sizes:'192x192',type:'image/png',purpose:'any maskable'}]};
 $('#manifestLink').href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m));}catch(e){}}
function init(){setupManifest();S=loadSave();
 if(S){offlineProgress();}else{S=freshState();}
 S.savedAt=Date.now();save();render();
 if(!S.seenIntro)openModal(introHTML(),true);
 requestAnimationFrame(frame);}
window.HT={get S(){return S;},set S(v){S=v;},weeks(n){for(let i=0;i<n;i++)weekly();dirty();},advance,save,loadSave,netWorth,launch,startVenture,offlineProgress,render};
init();
